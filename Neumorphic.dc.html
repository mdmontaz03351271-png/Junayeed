<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Welcome Login</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Poppins',system-ui,sans-serif;background:#E9ECF2}
input:focus-visible,button:focus-visible{outline:2px solid {{accent}};outline-offset:3px}
input::placeholder{color:#5B6270;opacity:1}
button{font-family:inherit;cursor:pointer}
.raised:hover{box-shadow:inset 4px 4px 10px #C4C9D6, inset -4px -4px 10px #FFFFFF !important}
.raised:active{box-shadow:inset 6px 6px 12px #C4C9D6, inset -6px -6px 12px #FFFFFF !important}
.textlink:hover{text-decoration:underline}
a{color:{{accent}};text-decoration:none}
a:hover{text-decoration:underline}
</style>
</helmet>
<div style="position: relative; overflow: hidden; box-sizing: border-box; min-height: 800px; padding: 48px 20px; display: flex; align-items: center; justify-content: center; background: #E9ECF2; font-family: 'Poppins', system-ui, sans-serif">

<div aria-hidden="true" style="position: absolute; left: -60px; top: 14%; width: 220px; height: 220px; border-radius: 56px; background: #E9ECF2; box-shadow: 14px 14px 30px #C4C9D6, -14px -14px 30px #FFFFFF"></div>
<div aria-hidden="true" style="position: absolute; right: 12%; top: 22%; width: 120px; height: 120px; border-radius: 40px; background: #E9ECF2; box-shadow: 10px 10px 24px #C4C9D6, -10px -10px 24px #FFFFFF"></div>
<div aria-hidden="true" style="position: absolute; right: 6%; bottom: 8%; width: 190px; height: 190px; border-radius: 52px; background: #E9ECF2; box-shadow: 14px 14px 30px #C4C9D6, -14px -14px 30px #FFFFFF"></div>

<form style="position: relative; width: 100%; max-width: 440px; box-sizing: border-box; padding: 44px 36px 40px; display: flex; flex-direction: column; align-items: stretch; gap: 24px; border-radius: 32px; background: #E9ECF2; box-shadow: 20px 20px 50px #C4C9D6, -20px -20px 50px #FFFFFF" onSubmit="{{noSubmit}}">

<div style="display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
<div aria-hidden="true" style="width: 88px; height: 88px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #E9ECF2; box-shadow: 8px 8px 18px #C4C9D6, -8px -8px 18px #FFFFFF">
<sc-if value="{{isLogin}}" hint-placeholder-val="{{ true }}">
<svg width="34" height="34" viewBox="0 0 24 24" fill="{{accent}}"><path d="M17 9h-1V7a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2zm-7-2a2 2 0 0 1 4 0v2h-4V7z"></path></svg>
</sc-if>
<sc-if value="{{isSignup}}" hint-placeholder-val="{{ false }}">
<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 20v-1.5a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4V20"></path><circle cx="9" cy="7.5" r="3.5"></circle><path d="M19 8v6M16 11h6"></path></svg>
</sc-if>
</div>
<h1 style="margin: 8px 0 0; font-size: 30px; font-weight: 700; color: #2B303B">{{title}}</h1>
<p style="margin: 0; font-size: 15px; color: #5B6270">{{subtitle}}</p>
</div>

<sc-if value="{{isLogin}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 24px">

<div style="display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column">
<label for="email" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Email or Phone Number</label>
<input id="email" type="text" placeholder="Email or Phone Number" autocomplete="username" style="height: 56px; box-sizing: border-box; padding: 0 20px; font-size: 15px; font-family: inherit; color: #2B303B; background: #E9ECF2; border: none; border-radius: 16px; box-shadow: inset 6px 6px 12px #C4C9D6, inset -6px -6px 12px #FFFFFF">
</div>

<div style="position: relative; display: flex; align-items: center">
<label for="pw" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Password</label>
<input id="pw" type="{{pwType}}" placeholder="Password" autocomplete="current-password" style="width: 100%; height: 56px; box-sizing: border-box; padding: 0 60px 0 20px; font-size: 15px; font-family: inherit; color: #2B303B; background: #E9ECF2; border: none; border-radius: 16px; box-shadow: inset 6px 6px 12px #C4C9D6, inset -6px -6px 12px #FFFFFF">
<button type="button" aria-label="{{eyeLabel}}" onClick="{{togglePw}}" style="position: absolute; right: 6px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; border-radius: 50%; color: #5B6270">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle><sc-if value="{{pwVisible}}" hint-placeholder-val="{{ false }}"><path d="M3 3l18 18"></path></sc-if></svg>
</button>
</div>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap">
<label style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 14px; color: #3C4250; cursor: pointer">
<input type="checkbox" style="width: 18px; height: 18px; margin: 0; accent-color: {{accent}}">
<span>Remember me</span>
</label>
<a href="{{waLink}}" target="_blank" rel="noopener" style="font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; min-height: 44px">Forgot Password?</a>
</div>

<button type="button" class="raised" style="height: 56px; font-size: 16px; font-weight: 600; color: {{accent}}; background: #E9ECF2; border: none; border-radius: 16px; box-shadow: 8px 8px 18px #C4C9D6, -8px -8px 18px #FFFFFF">Login</button>

<div style="display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; font-size: 14px; color: #5B6270">
<button type="button" class="raised" onClick="{{goSignup}}" style="width: 100%; height: 56px; font-size: 15px; font-weight: 500; color: {{accent}}; background: #E9ECF2; border: none; border-radius: 16px; box-shadow: 8px 8px 18px #C4C9D6, -8px -8px 18px #FFFFFF">Don't have an account?</button>
</div>

</div>
</sc-if>

<sc-if value="{{isSignup}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 24px">

<div style="display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column">
<label for="name" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Full Name</label>
<input id="name" type="text" placeholder="Full Name" autocomplete="name" style="height: 56px; box-sizing: border-box; padding: 0 20px; font-size: 15px; font-family: inherit; color: #2B303B; background: #E9ECF2; border: none; border-radius: 16px; box-shadow: inset 6px 6px 12px #C4C9D6, inset -6px -6px 12px #FFFFFF">
</div>

<div style="display: flex; flex-direction: column">
<label for="su-email" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Email Address</label>
<input id="su-email" type="email" placeholder="Email Address" autocomplete="email" style="height: 56px; box-sizing: border-box; padding: 0 20px; font-size: 15px; font-family: inherit; color: #2B303B; background: #E9ECF2; border: none; border-radius: 16px; box-shadow: inset 6px 6px 12px #C4C9D6, inset -6px -6px 12px #FFFFFF">
</div>

<div style="display: flex; flex-direction: column">
<label for="su-phone" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Phone Number</label>
<input id="su-phone" type="tel" placeholder="Phone Number" autocomplete="tel" inputmode="tel" style="height: 56px; box-sizing: border-box; padding: 0 20px; font-size: 15px; font-family: inherit; color: #2B303B; background: #E9ECF2; border: none; border-radius: 16px; box-shadow: inset 6px 6px 12px #C4C9D6, inset -6px -6px 12px #FFFFFF">
</div>

<div style="position: relative; display: flex; align-items: center">
<label for="su-pw" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Password</label>
<input id="su-pw" type="{{pwType}}" placeholder="Password" autocomplete="new-password" style="width: 100%; height: 56px; box-sizing: border-box; padding: 0 60px 0 20px; font-size: 15px; font-family: inherit; color: #2B303B; background: #E9ECF2; border: none; border-radius: 16px; box-shadow: inset 6px 6px 12px #C4C9D6, inset -6px -6px 12px #FFFFFF">
<button type="button" aria-label="{{eyeLabel}}" onClick="{{togglePw}}" style="position: absolute; right: 6px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; border-radius: 50%; color: #5B6270">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle><sc-if value="{{pwVisible}}" hint-placeholder-val="{{ false }}"><path d="M3 3l18 18"></path></sc-if></svg>
</button>
</div>

<div style="display: flex; flex-direction: column">
<label for="su-pw2" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Confirm Password</label>
<input id="su-pw2" type="{{pwType}}" placeholder="Confirm Password" autocomplete="new-password" style="height: 56px; box-sizing: border-box; padding: 0 20px; font-size: 15px; font-family: inherit; color: #2B303B; background: #E9ECF2; border: none; border-radius: 16px; box-shadow: inset 6px 6px 12px #C4C9D6, inset -6px -6px 12px #FFFFFF">
</div>
</div>

<label style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 14px; color: #3C4250; cursor: pointer">
<input type="checkbox" style="width: 18px; height: 18px; margin: 0; flex: none; accent-color: {{accent}}">
<span>I agree to the <a href="#" style="font-weight: 500">Terms &amp; Conditions</a></span>
</label>

<button type="button" class="raised" style="height: 56px; font-size: 16px; font-weight: 600; color: {{accent}}; background: #E9ECF2; border: none; border-radius: 16px; box-shadow: 8px 8px 18px #C4C9D6, -8px -8px 18px #FFFFFF">Create Account</button>

<div style="display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; font-size: 14px; color: #5B6270">
<button type="button" class="raised" onClick="{{goLogin}}" style="width: 100%; height: 56px; font-size: 15px; font-weight: 500; color: {{accent}}; background: #E9ECF2; border: none; border-radius: 16px; box-shadow: 8px 8px 18px #C4C9D6, -8px -8px 18px #FFFFFF">Already have an account?</button>
</div>

</div>
</sc-if>

</form>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1D4ED8","options":["#1D4ED8","#0F766E","#7C3AED","#B45309"]},"whatsapp":{"editor":"text","default":"8801303351271"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pwVisible: false, mode: 'login' };
  }
  renderVals() {
    const v = this.state.pwVisible;
    const login = this.state.mode === 'login';
    return {
      accent: this.props.accent ?? '#1D4ED8',
      waLink: 'https://wa.me/' + String(this.props.whatsapp ?? '8801303351271').replace(/\D/g, '') + '?text=' + encodeURIComponent('Hello, I forgot my password. Please help me reset it.'),
      isLogin: login,
      isSignup: !login,
      title: login ? 'Welcome' : 'Create Account',
      subtitle: login ? 'Login to continue your journey' : 'Sign up to start your journey',
      pwVisible: v,
      pwType: v ? 'text' : 'password',
      eyeLabel: v ? 'Hide password' : 'Show password',
      togglePw: () => this.setState({ pwVisible: !this.state.pwVisible }),
      goSignup: () => this.setState({ mode: 'signup', pwVisible: false }),
      goLogin: () => this.setState({ mode: 'login', pwVisible: false }),
      noSubmit: (e) => { if (e && e.preventDefault) e.preventDefault(); }
    };
  }
}
</script>
</body>
</html>
